name: Alertes et scan

# La logique vit dans l'application : ce workflow ne fait qu'appeler une route
# protégée. Les indicateurs ne sont donc calculés qu'à un seul endroit, et le
# cron n'a besoin d'aucun accès à la base.

on:
  schedule:
    # Seuils de prix : toutes les 5 min, 9h-18h Paris (7h-16h UTC), lun-ven.
    # Ne consulte que les titres sous alerte, donc peu de requêtes.
    - cron: "*/5 7-16 * * 1-5"
    # Bascules de zone RSI : toutes les 30 min. Le balayage porte sur toute la
    # watchlist ; à 5 min d'intervalle Yahoo finirait par limiter, et un RSI ne
    # bouge pas assez en cinq minutes pour le justifier.
    - cron: "*/30 7-16 * * 1-5"
    # Scan des titres en survente : une fois, à 9h30 Paris.
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Tâche à lancer"
        type: choice
        options: [alerts, prix, rsi, scan]
        default: alerts

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer la tâche
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "30 7 * * 1-5")     echo "job=scan" >> "$GITHUB_OUTPUT" ;;
              "*/30 7-16 * * 1-5") echo "job=rsi"  >> "$GITHUB_OUTPUT" ;;
              *)                   echo "job=prix" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Appeler la route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          job="${{ steps.pick.outputs.job }}"
          echo "Tâche : $job"
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            --max-time 300 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/cron/alerts?job=$job")
          cat /tmp/out.json; echo
          # 207 signale des erreurs par utilisateur sans faire échouer le lot.
          if [ "$code" != "200" ] && [ "$code" != "207" ]; then
            detail=$(python3 -c "import json,sys; print(json.load(open('/tmp/out.json')).get('error',''))" 2>/dev/null || true)
            echo "::error::HTTP $code — ${detail:-réponse illisible}"
            exit 1
          fi
